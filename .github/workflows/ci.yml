name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-scripts:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Check install.sh with shellcheck
        run: shellcheck install.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate OpenCode plugin
        run: |
          # Placeholders are replaced by JSON literals, as src/setup/plugin.rs does.
          rendered="$RUNNER_TEMP/skillvolution.mjs"
          sed \
            -e 's|__SKILLVOLUTION_BIN__|"/usr/bin/skillvolution"|g' \
            -e 's|__SKILLVOLUTION_DB__|"/tmp/skillvolution.db"|g' \
            -e 's|__SKILLVOLUTION_PROJECT_KEY__|null|g' \
            assets/opencode/skillvolution.js > "$rendered"
          node --check "$rendered"

  msrv:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
