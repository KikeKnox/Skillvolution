name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-scripts:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Check install.sh with shellcheck
        run: shellcheck install.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate OpenCode plugin
        run: |
          set -e
          # Create a temp mjs file from the plugin, replacing placeholders
          temp_file=$(mktemp --suffix=.mjs)
          trap "rm -f '$temp_file'" EXIT
          sed \
            -e 's|__SKILLVOLUTION_BIN__|/usr/bin/skillvolution|g' \
            -e 's|__SKILLVOLUTION_DB__|/tmp/skillvolution.db|g' \
            assets/opencode/skillvolution.js > "$temp_file"
          # Syntax-check the rendered file
          node --check "$temp_file"

  msrv:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
