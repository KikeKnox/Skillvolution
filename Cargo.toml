[package]
name = "skillvolution"
version = "0.1.2"
edition = "2024"
description = "A shared procedural skill vault for AI coding agents"
license = "MIT"
repository = "https://github.com/KikeKnox/Skillvolution"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
similar = "3.2.0"

[dev-dependencies]
tempfile = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
