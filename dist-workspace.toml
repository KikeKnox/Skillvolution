[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
# Path that installers should place binaries in
install-path = "~/.local/bin"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# A tag's release must not ship untested code: run CI's checks before building artifacts.
plan-jobs = ["./ci"]
# release.yml's `host` job is hand-edited to also require custom-ci's success (a failing CI
# otherwise leaves the builds "skipped" and still publishes an empty release); keep `dist`
# from rejecting that edit. After `dist generate`, reapply it.
allow-dirty = ["ci"]

# GitHub retired the macos-14 image dist defaults to for this target.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"
